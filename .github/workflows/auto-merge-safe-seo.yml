name: Safe SEO PR Check

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: safe-seo-check-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate safe SEO PR
    if: >-
      ${{ github.event.pull_request.base.ref == 'main' &&
          contains(github.event.pull_request.labels.*.name, 'automation') &&
          contains(github.event.pull_request.labels.*.name, 'seo') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch validator
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate safe SEO PR
        id: validate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/validate-safe-seo-pr.mjs

      - name: Comment safe SEO validation summary
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'reports/safe-seo-validation/summary.md';
            const body = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8')
              : '## Safe SEO PR Check: Failed\n\nValidation summary was not generated.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

      - name: Stop when safe SEO validation fails
        if: ${{ steps.validate.outcome != 'success' }}
        run: exit 1
