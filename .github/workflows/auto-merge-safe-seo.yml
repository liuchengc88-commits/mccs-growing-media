name: Auto Merge Safe SEO

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: auto-merge-safe-seo-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-and-merge:
    name: Validate and auto-merge safe SEO PR
    if: ${{ github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch validator
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate safe SEO PR
        id: validate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/validate-safe-seo-pr.mjs

      - name: Comment safe SEO validation summary
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'reports/safe-seo-validation/summary.md';
            const body = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8')
              : '## Safe SEO Auto-Merge Check: Failed\n\nValidation summary was not generated.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

      - name: Stop when safe SEO validation fails
        if: ${{ steps.validate.outcome != 'success' }}
        run: exit 1

      - name: Squash merge safe SEO PR and delete branch
        if: ${{ steps.validate.outcome == 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const merge = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: 'squash',
              commit_title: pr.title,
              commit_message: 'Auto-merged after safe SEO validation passed.'
            });

            if (!merge.data.merged) {
              throw new Error(`Merge did not complete: ${merge.data.message}`);
            }

            if (pr.head.repo.full_name === pr.base.repo.full_name) {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${pr.head.ref}`
              });
            }
